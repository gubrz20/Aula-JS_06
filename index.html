<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <link rel="stylesheet" href="estoque.js">
    <link rel="stylesheet" href="style.css">

    <main class="container">
    <header class="main-header">
      <h1>Controle de Estoque</h1>
    </header>

    <section class="dashboard">
      <article class="card">
        <h3>Total de Produtos</h3>
        <span id="total-produtos">0</span>
      </article>
      <article class="card">
        <h3>Itens em Estoque</h3>
        <span id="total-itens">0</span>
      </article>
      <article class="card">
        <h3>Valor Total</h3>
        <span id="valor-total">R$ 0,00</span>
      </article>
      <article class="card warning">
        <h3>Estoque Critico (&lt; 5)</h3>
        <span id="estoque-critico">0</span>
      </article>
    </section>

    <section class="main-content">
      <form id="form-produto" class="form-card">
        <h2>Cadastrar Produto</h2>
        <p class="form-group">
          <label for="nome">Nome do Produto</label>
          <input type="text" id="nome" required>
        </p>
        <p class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="Eletronicos">Eletronicos</option>
            <option value="Calçados">Calçados</option>
            <option value="Alimentos">Alimentos</option>
            <option value="Livros">Livros</option>
            <option value="Brinquedos">Brinquedos</option>
          </select>
        </p>
        <p class="form-group">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" step="0.01" min="0" required>
        </p>
        <p class="form-group">
          <label for="estoque">Quantidade em Estoque</label>
          <input type="number" id="estoque" min="0" required>
        </p>
        <button type="submit">Adicionar Produto</button>
      </form>

      <article class="table-card">
        <header class="table-header">
          <h2>Lista de Produtos</h2>
          <section class="filters">
            <input type="text" id="busca" placeholder="Buscar por nome...">
            <select id="filtro-categoria">
              <option value="todos">Todas Categorias</option>
              <option value="Eletronicos">Eletronicos</option>
              <option value="Calçados">Calçados</option>
              <option value="Alimentos">Alimentos</option>
              <option value="Livros">Livros</option>
              <option value="Brinquedos">Brinquedos</option>
            </select>
          </section>
        </header>
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Qtd</th>
              <th>Total (R$)</th>
              <th>Status</th>
              <th>Açoes</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos">
          </tbody>
        </table>
      </article>
    </section>
  </main>

</body>
</html>
